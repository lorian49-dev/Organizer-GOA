<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inicio de sesion</title>
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body class="body-login">
    <div class="container">
        <div class="left">
            <form class="form-login">
              <div class="logo-andes-form"><img src="/src/logo-types/GOA-LOGO.png" alt="" width="150px"></div>
              <h1>Ingreso</h1>
                <p class="messaeg-wrong-login"></p>
              <label class="info-">
                <input type="text" placeholder=" " name="username" class="input-user-name"><span>usuario*</span>
              </label>
              <label class="info-">
                <input type="password" placeholder=" " name="password" class="input-password"><span>Contraseña*</span>
              </label>
              <button type="submit" class="primary-btn">Continuar</button>
            </form>
        </div>
        <div class="right">
            
        </div>
    </div>
    <div class="modal-container-login">
     <div class="modal-window-login">
      <span class="circle"></span>
      <span class="message">Iniciando Sesion</span>
     </div>
    </div>
    <script src="../events/login.js"></script>
</body>
</html>
