<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de manifiestos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../styles/index.css">
</head>
<body>
<div class="container">
 <nav>
        <span class="back-home"  onclick="goHome()">
            <i class="fa-solid fa-arrow-left"></i>
        </span>
        <ul class="list-navegation-ul">
        <li><i class="fa-solid fa-bars-staggered" title="Expandir menu"></i></li>
         <li><i class="fa-solid fa-magnifying-glass"></i>  
          <form action="/search-mid" class="form-search-glass form-documents" method="get">
           <label class="label-for-search-input">
            <input type="text" name="glass_model" id="search-glass" placeholder="Nombre de documento..." autocomplete="off">
             <div class="field-results-glasses">
            
             </div>
           </label>
          </form>
         </li>
         <li><a href="/monturas"><i class="fa-solid fa-glasses"></i><span class="nav-description">Monturas</span></a></li>
         <li><a href="/facturas"><i class="fa-solid fa-file-invoice-dollar"></i><span class="nav-description">Facturas</span></a></li>
         <li><a href="#"><span class="bold"><i class="fa-solid fa-file-invoice"></i><span class="nav-description">Manifiestos</span></span></a></li>
         <li><i class="fa-solid fa-cloud-arrow-up"></i><span class="nav-description">Subir Manifiesto</span></li>
        </ul>
        <div class="drag-and-drop">
          <div class="shape-drag-and-drop">
            <div class="drop-file-space">
             <i class="fa-solid fa-upload"></i>
              <p>Arrastra maximo 15 PDF</p>
               <input type="file" name="pdf" id="btn-file" accept=".pdf" multiple hidden>
            </div>
            <div class="drop-file-process">
                <div class="file">
                    <span class="check-feedback"></span>
                    <div class="process-container">
                        <div class="process-bar"></div>
                    </div>
                </div>
            </div>
          </div>
        </div>
         <span class="container-feedback-file">
            <p id="file-info"></p>
            <span class="feedback-circle"></span>
         </span>
         <!--Boton de Cierre de sesion-->
                  <button id="btn-log-out" onclick="logoutBtn()" title="cerrar sesion"><i class="fa-solid fa-power-off"></i></button>
      </nav>
    <main class="load-manifest-and-invoice-container">

         <!--<p>Carga un manifiesto (Maximo 15 Documentos)</p>

    <form action="/manifest-table-post" method="post" enctype="multipart/form-data" class="upload-file-form">
        <input type="file" name="pdf" id="btn-file"  style="margin-bottom: 25px" accept=".pdf" multiple>
        <button type="submit" class="btn-upload">Cargar<i class="fa-solid fa-upload"></i></button>
    </form>-->

    <h1>Administracion de Manifiestos</h1>
        <div class="filer-modules">
            <div class="container-filters">
            <span class="filter-bar"><i class="fa-solid fa-sliders"></i></span>
             <span class="filter-by-model">Codigo<i class="fa-solid fa-plus"></i></span>
              <span class="filter-by-reference">Referencia<i class="fa-solid fa-plus"></i></span>
         </div>
       </div>
<div class="pdf-container">
     <span class="table-buttons">
        <button onclick="clickBack()" class="btnBack"><i class="fa-solid fa-angle-up" style="transform: rotate(270deg);"></i></button>
        <button onclick="clickNext()" class="btnNext"><i class="fa-solid fa-angle-up" style="transform: rotate(90deg);"></i></button>
        <span class="page-info">
            <!--Aqui aparecera el numero de registros y paginas-->
             v                                   
        </span>
     </span>
     
     <table>
        <thead>
            <th>Name</th>
            <th>Size</th>
            <th>Date</th>
            <th>Ver</th>
            <th>Acciones</th>
        </thead>
        <tbody class="pdf-container-tbody">
            
        </tbody>
     </table>
     <span class="empty-message"></span>
    </div>
    </main>
</div>
<script src="/events/loadManifestInvoices.js"></script>
</body>
</html>
