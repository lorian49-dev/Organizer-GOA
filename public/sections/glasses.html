<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monturas</title>
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav>
        <span class="back-home"  onclick="goHome()">
            <i class="fa-solid fa-arrow-left"></i>
        </span>
        <ul>
            <li><a href="#"><span class="bold">Cargar Monturas</span></a></li>
            <li><a href="/sections/loadFile.html">Facturas</a></li>
            <li><a href="/sections/loadManifest.html">Manifiestos</a></li>
        </ul>
        <form action="" class="form-search-glass">
        <label for="search-glass">
            <input type="text" name="search-glass" id="search-glass" placeholder="Numero de modelo Ej: M27142...">
        </label>
    </form>
</nav>
<div class="main-glasses">
    <div class="img-container">
        
            <button class="btn-info">Adicionar</button>
        
    </div>
    <div class="img-container-2">
            <button class="btn-info">Explorar</button>
    </div>
</div>
<script>
     const goHome = () =>{
        window.location.href = '/'
    }

    const buttonInfo = document.querySelectorAll('.btn-info')
    const firstContainer = document.querySelector('.img-container')
    const secondContainer = document.querySelector('.img-container-2')

    let state = false

    buttonInfo[0].addEventListener('click', (btn)=>{
        firstContainer.classList.toggle('active')
        
        if(!state){
            const formularioCreado = document.createElement('form')
            formularioCreado.innerHTML = `
                 <form class="glass-form">
                    <label for="brand-glass">Marca</label>
                    <input type="text" name="brand-glass">
                    <label for="brand-glass">Codigo #</label>
                    <input type="text" name="brand-glass"> 
                    <label for="brand-glass">Orden de compra</label>
                    <input type="text" name="brand-glass"> 
                </form>`;
            formularioCreado.id = 'formularioEmergente'
            firstContainer.appendChild(formularioCreado)
            state = true
        } else{
            const formularioCreado = document.getElementById('formularioEmergente')
            formularioCreado.remove();
            state = false
        }

    })

    buttonInfo[1].addEventListener('click', (btn)=>{
        secondContainer.classList.toggle('active')
        

    })



    document.addEventListener('DOMContentLoaded', ()=>{
      setTimeout(()=>{
       document.body.style.opacity = '1'
       document.body.style.pointerEvents = 'auto'
      }, 1000)
    })

</script>
</body>
</html>
