<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monturas</title>
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav>
        <span class="back-home"  onclick="goHome()">
            <i class="fa-solid fa-arrow-left"></i>
        </span>
        <ul>
            <li><a href="#"><span class="bold">Cargar Monturas</span></a></li>
            <li><a href="/sections/loadFile.html">Facturas</a></li>
            <li><a href="/sections/loadManifest.html">Manifiestos</a></li>
        </ul>
        <form action="" class="form-search-glass">
        <label for="search-glass">
            <input type="text" name="search-glass" id="search-glass" placeholder="Numero de modelo Ej: M27142...">
        </label>
    </form>
</nav>
<div class="main-glasses">
    <div class="img-container">
            <button class="btn-info">Adicionar</button>
        <form class="glass-form" method="POST" action="/glasses">
            <label class="glass-form-label"><input type="text" placeholder=" " class="glass-form-input" name="brand" required><span class="glass-form-span">Marca</span></label>
            <label class="glass-form-label"><input type="text" placeholder=" " class="glass-form-input" name="serial" required><span class="glass-form-span"># Serie</span></label>
            <label class="glass-form-label"><input type="text" placeholder=" " class="glass-form-input" name="order" required><span class="glass-form-span"># Orden</span></label>
            <!--Desde aqui se separan los inputs anteriores a los campos de eleccion de Facturas y manifiestos-->
            <label class="selection-invoice">
                <input type="text" placeholder="Escoger Factura *" id="id-input-name-invoice">
                <input type="hidden" id="id-input-invoice" name="id_invoice">
                <div class="invoice-result-field">

                </div>
            </label>
            <label class="selection-manifest">
                <input type="text" placeholder="Escoger Manifiesto *" id="id-input-name-manifest">
                <input type="hidden" id="id-input-manifest" name="id_manifest">
                <div class="manifest-result-field">

                </div>
            </label>
            <button class="btn-submit-info" type="submit">Registrar</button>
        </form>
    </div>
    <div class="img-container-2">
            <button class="btn-info">Explorar</button>
            <div class="table-container">
            <table class="space-table">
                <thead>
                    <th>Marca</th>
                    <th>Referencia</th>
                    <th>Orden de Compra</th>
                    <th>Ver Factura</th>
                    <th>Ver manifiesto</th>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
        </div>
    </div>
</div>
<script>
    // Const for dropDown

    // for Invoices

    const nameFieldInvoice = document.getElementById('id-input-name-invoice');
    const idFieldInvoice = document.getElementById('id-input-invoice');
    const fieldResultInvoice = document.querySelector('.invoice-result-field')

    // for Manifest

    const nameFieldManifest = document.getElementById('id-input-name-manifest');
    const idFieldManifest = document.getElementById('id-input-manifest');
    const fieldResultManifest = document.querySelector('.manifest-result-field')

    // End const for the dropDown ^
    const btnInfoShow = document.querySelectorAll('.btn-info');
    const formContainer = document.querySelector('.img-container');
    const tableContainer = document.querySelector('.img-container-2');
    const tableGlasses = document.querySelector('.table-container')
    const formGlasses = document.querySelector('.glass-form')
    // Estados cambiantes
    let tableState = false
    let formState = false

   const autocompleteMI = async (name, id, field, fetchUrl, idTable) => {
        field.innerHTML = '';
        field.style.display = 'none';
        const value = name.value;

        if(value.length < 2) return

        const res = await fetch(`${fetchUrl}${value}`);
        const data = await res.json();

        data.forEach(item =>{
            const itemResult = document.createElement('div');
            itemResult.textContent = item.name
            itemResult.classList.add('result-item')
            itemResult.addEventListener('click', ()=>{
                name.value = item.name;
                id.value = item[idTable];
                field.innerHTML = ''
                field.style.display = 'none'
            })

            field.appendChild(itemResult)
            field.style.display = 'block'
        })

    }
// Funcion de redireccionar la ubicacion actual a la pagina principal
    function goHome(){
        window.location.href = '/';
    }

    // Funcion de debounce

   function debounce(fn, delay){
    let timeout;
    return function(...args){
        clearTimeout(timeout);
        timeout = setTimeout(()=>{
            fn.apply(this, args)
        }, delay)
    }
   }

     document.addEventListener('DOMContentLoaded', ()=>{
        setTimeout(()=>{
         document.body.style.opacity = 1
         document.body.style.pointerEvents = 'auto'
        }, 1000)

        //-------------------------------------------------//
        //                   Show Form
        //-------------------------------------------------//

        btnInfoShow[0].addEventListener('click', ()=>{
         formContainer.classList.toggle('active')
 
         if(!formState){
            formGlasses.style.display = 'flex';
            // manejo de envento al hacer click fuera del campo de resultados
            document.addEventListener('click', (e)=>{
             if(!fieldResultInvoice.contains(e.target) && !fieldResultManifest.contains(e.target)){
                fieldResultInvoice.style.display = 'none';
                fieldResultManifest.style.display = 'none'
             }
            })

            nameFieldInvoice.addEventListener('input', debounce(()=>{
            autocompleteMI(nameFieldInvoice, idFieldInvoice, fieldResultInvoice, '/search-invoice?q=', 'id_invoice')
            }, 300))

            nameFieldManifest.addEventListener('input', debounce(()=>{
                 autocompleteMI(nameFieldManifest, idFieldManifest, fieldResultManifest, '/search-manifest?q=', 'id_manifest')
            }, 300))

            formState=true;
         }else{
            formGlasses.style.display = 'none'
            formState=false;
         }


        })

        //-------------------------------------------------//
        //                   Show Table
        //-------------------------------------------------//

        btnInfoShow[1].addEventListener('click', ()=>{
         tableContainer.classList.toggle('active')

         if(!tableState){
         tableGlasses.style.display = 'block';
         tableState = true;
         } else{
         tableGlasses.style.display = 'none';
         tableState = false;
         }

        })
        // end
     })
</script>
</body>
</html>
