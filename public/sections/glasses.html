<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monturas</title>
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav>
        <span class="back-home"  onclick="goHome()">
            <i class="fa-solid fa-arrow-left"></i>
        </span>
        <ul>
            <li><a href="#"><span class="bold">Cargar Monturas</span></a></li>
            <li><a href="/sections/loadFile.html">Facturas</a></li>
            <li><a href="/sections/loadManifest.html">Manifiestos</a></li>
        </ul>
        <form action="" class="form-search-glass">
        <label for="search-glass">
            <input type="text" name="search-glass" id="search-glass" placeholder="Numero de modelo Ej: M27142...">
        </label>
    </form>
</nav>
<div class="main-glasses">
    <div class="img-container">
        
            <button class="btn-info">Adicionar</button>
        <form class="glass-form" method="POST" action="/"></form>
    </div>
    <div class="img-container-2">
            <button class="btn-info">Explorar</button>
            <div class="table-container">
            <table class="space-table">
                <thead>
                    <th>Marca</th>
                    <th>Referencia</th>
                    <th>Orden de Compra</th>
                    <th>Ver Factura</th>
                    <th>Ver manifiesto</th>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
        </div>
    </div>
</div>
<script>
     const goHome = () =>{
        window.location.href = '/'
    }
    const buttonInfo = document.querySelectorAll('.btn-info')
    const firstContainer = document.querySelector('.img-container')
    const secondContainer = document.querySelector('.img-container-2')
    const formularioCreado = document.querySelector('.glass-form')
    const tableContainer = document.querySelector('.table-container')
    
    let state = false
    let stateTable = false


    document.addEventListener('DOMContentLoaded', ()=>{
      setTimeout(()=>{
       document.body.style.opacity = '1'
       document.body.style.pointerEvents = 'auto'
      }, 1000)

 buttonInfo[0].addEventListener('click', (btn)=>{
        firstContainer.classList.toggle('active')
        
        if(!state){
            formularioCreado.style.display = 'flex'
            formularioCreado.innerHTML = `
                     <label><input type="text" name="brand-glass" class="form-input" placeholder=" " required><span class="span-input">Marca</span></label>
                    <label><input type="text" name="brand-glass" class="form-input" placeholder=" " required><span class="span-input">Codigo</span></label>
                    <label><input type="text" name="brand-glass" class="form-input" placeholder=" " required><span class="span-input">Orden #</span></label>
                    <label>Facturas<br>
                        <input type="text" id="searchInvoice" placeholder="Buscar Factura...">
                        <input type="hidden" id="invoiceId">
                        <div class="results" id="searchInvoiceResults"></div>
                   </label>

                    <label>Manifiestos<br>
                        <input type="text" id="searchManifest" placeholder="Buscar manifiesto...">
                        <input type="hidden" id="manifestId">
                        <div id="searchManifestResults"></div>
                    </label>
                    <button type="submit" class="btn-submit-info">Enviar</button>
                    `;
            firstContainer.appendChild(formularioCreado)
            state = true
// Listener para el evento de autocompletado para busqueda de Facturas y manifiestos.
           const searchInvoice = document.getElementById('searchInvoice')
           const invoiceId = document.getElementById('invoiceId')
           const invoiceField = document.getElementById('searchInvoiceResults')
           
           searchInvoice.addEventListener('input', async()=>{
            invoiceField.innerHTML = ''
            invoiceField.style.display = 'none'
            const value = searchInvoice.value

            if(value.length < 2){
                invoiceField.style.display = 'none'
                return
            }

            const res = await fetch(`/search-invoice?q=${value}`);
            const data = await res.json();

            data.forEach(invoice =>{
                const fileMatch = document.createElement('div')
                fileMatch.textContent = invoice.name;
                fileMatch.classList.add('result-item');

                fileMatch.addEventListener('click', ()=>{
                    searchInvoice.value = invoice.name;
                    invoiceId.value = invoice.id_invoice
                    invoiceField.innerHTML = ''
                    invoiceField.style.display = 'none'
                })
 
                invoiceField.appendChild(fileMatch)
                invoiceField.style.display = 'block'

            })
           })

           const searchManifest = document.getElementById('searchManifest')
           const manifestId = document.getElementById('manifestId')
           const manifestField = document.getElementById('searchManifestResults')

           searchManifest.addEventListener('input', async()=>{
            manifestField.innerHTML = '';
            manifestField.style.display = 'none'
            const value = searchManifest.value;

            if(value.length < 2){
                manifestField.style.display = 'none';
                return
            }

            const res = await fetch(`/search-manifest?q=${value}`)
            const data = await res.json();

                data.forEach(manifest =>{
                const currentItem = document.createElement('div');
                currentItem.textContent = manifest.name;
                currentItem.classList.add('result-item');

                currentItem.addEventListener('click', ()=>{
                    searchManifest.value = manifest.name;
                    manifestId.value = manifest.id_manifest;
                    manifestField.innerHTML = ''
                    manifestField.style.display = 'none'
                })

                manifestField.appendChild(currentItem)
                manifestField.style.display = 'block'

            })

           })

        } else{
            const formularioCreado = document.querySelector('.glass-form')
            formularioCreado.style.display = 'none';
            state = false
        }
        
        const span_input = document.querySelectorAll('.span-input')
        const form_input = document.querySelectorAll('.form-input')

        

    })

     buttonInfo[1].addEventListener('click', (btn)=>{
        secondContainer.classList.toggle('active')
        
        if(!stateTable){
            tableContainer.style.display = 'block'
            stateTable = true
        } else{
            tableContainer.style.display = 'none'
            stateTable = false
        }
        
    })


    })

</script>
</body>
</html>
