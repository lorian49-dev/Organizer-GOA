<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monturas</title>
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav>
        <span class="back-home"  onclick="goHome()">
            <i class="fa-solid fa-arrow-left"></i>
        </span>
        <ul>
            <li><a href="#"><span class="bold">Cargar Monturas</span></a></li>
            <li><a href="/facturas">Facturas</a></li>
            <li><a href="/manifiestos">Manifiestos</a></li>
        </ul>
        <form action="/search-mid" class="form-search-glass" method="get">
        <label class="label-for-search-input">
            <input type="text" name="glass_model" id="search-glass" placeholder="Numero de serie o referencia Ej: M27142/ZD7701..." autocomplete="off">
            <div class="field-results-glasses">
            
        </div>
        </label>
    </form>
</nav>
<div class="main-glasses">
    <div class="img-container active">
            <button class="btn-info">Adicionar</button>
        <form class="glass-form" method="POST" action="/glasses">
            <label class="glass-form-label"><input type="text" placeholder=" " class="glass-form-input" name="brand" required><span class="glass-form-span">Marca</span></label>
            <label class="glass-form-label"><input type="text" placeholder=" " class="glass-form-input" name="serial" required><span class="glass-form-span"># Codigo</span></label>
            <label class="glass-form-label"><input type="text" placeholder=" " class="glass-form-input" name="reference" required><span class="glass-form-span"># Referencia</span></label>
            <label class="glass-form-label"><input type="text" placeholder=" " class="glass-form-input" name="color" required><span class="glass-form-span">Color de montura</span></label>
            <label class="glass-form-label"><input type="text" placeholder=" " class="glass-form-input" name="order" required><span class="glass-form-span"># Orden</span></label>
            <!--Desde aqui se separan los inputs anteriores a los campos de eleccion de Facturas y manifiestos-->
           <div class="box-selection-invoice-manifest">
             <label class="selection-invoice">
                <input type="text" placeholder="Escoger Factura *" id="id-input-name-invoice" autocomplete="off">
                <input type="hidden" id="id-input-invoice" name="id_invoice">
                <div class="invoice-result-field">

                </div>
            </label>
            <label class="selection-manifest">
                <input type="text" placeholder="Escoger Manifiesto *" id="id-input-name-manifest" autocomplete="off">
                <input type="hidden" id="id-input-manifest" name="id_manifest">
                <div class="manifest-result-field">

                </div>
            </label>
           </div>
            <button class="btn-submit-info" type="submit">Registrar</button>
        </form>
    </div>
    <div class="img-container-2">
            <button class="btn-info">Explorar</button>
            <div class="table-container">
             <div class="table-shorts">
                <button onclick="clickBack()" class="btnBack"><i class="fa-solid fa-angle-up" style="transform: rotate(270deg);"></i></button>
                <button onclick="clickNext()" class="btnNext"><i class="fa-solid fa-angle-up" style="transform: rotate(90deg);"></i></button>
                <span class="page-info">
            <!--Aqui aparecera el numero de registros y paginas-->
                </span>
             </div>    
            <div class="overflow-table">
             <table class="space-table">
                <thead>
                    <th>Marca</th>
                    <th>Referencia</th>
                    <th>Orden de Compra</th>
                    <th>Ver Factura</th>
                    <th>Ver manifiesto</th>
                </thead>
                <tbody class="body-table-glass">
                </tbody>
            </table>
            </div>
        </div>
    </div>
</div>
<script>

    // Buscador de Gafas

    const inputSearchGlass = document.getElementById('search-glass')
    const searchGlassResults = document.querySelector('.field-results-glasses')

    // Tabla de Monturas
    const tableGlass = document.querySelector('.body-table-glass');
    let currentPage = 1
    let globalCount = 0
    const btnBack = document.querySelector('.btnBack')
    const btnNext = document.querySelector('.btnNext')
    // Const for dropDown

    // for Invoices

    const nameFieldInvoice = document.getElementById('id-input-name-invoice');
    const idFieldInvoice = document.getElementById('id-input-invoice');
    const fieldResultInvoice = document.querySelector('.invoice-result-field')

    // for Manifest

    const nameFieldManifest = document.getElementById('id-input-name-manifest');
    const idFieldManifest = document.getElementById('id-input-manifest');
    const fieldResultManifest = document.querySelector('.manifest-result-field')

    // End const for the dropDown ^
    const btnInfoShow = document.querySelectorAll('.btn-info');
    const formContainer = document.querySelector('.img-container');
    const tableContainer = document.querySelector('.img-container-2');
    const tableGlasses = document.querySelector('.table-container')
    const formGlasses = document.querySelector('.glass-form')
    // Estados cambiantes
    let tableState = false
    let formState = false

   const autocompleteMI = async (name, id, field, fetchUrl, idTable) => {
        field.innerHTML = '';
        field.style.display = 'none';
        const value = name.value;

        if(value.length < 2) return

        const res = await fetch(`${fetchUrl}${value}`);
        const data = await res.json();

        data.forEach(item =>{
            const itemResult = document.createElement('div');
            itemResult.textContent = item.name
            itemResult.classList.add('result-item')
            itemResult.addEventListener('click', ()=>{
                name.value = item.name;
                id.value = item[idTable];
                field.innerHTML = ''
                field.style.display = 'none'
            })

            field.appendChild(itemResult)
            field.style.display = 'block'
        })

    }
// Funcion de redireccionar la ubicacion actual a la pagina principal
    function goHome(){
        window.location.href = '/';
    }

    // Funcion de debounce

   function debounce(fn, delay){
    let timeout;
    return function(...args){
        clearTimeout(timeout);
        timeout = setTimeout(()=>{
            fn.apply(this, args)
        }, delay)
    }
   }

     document.addEventListener('DOMContentLoaded', ()=>{
        setTimeout(()=>{
         document.body.style.opacity = 1
         document.body.style.pointerEvents = 'auto'
        }, 1000)
     })
        //-------------------------------------------------//
        //                   Show Form
        //-------------------------------------------------//

       /* btnInfoShow[0].addEventListener('click', ()=>{
         formContainer.classList.toggle('active')
 */
         if(!formState){
            formGlasses.style.display = 'flex';
            // manejo de envento al hacer click fuera del campo de resultados
            document.addEventListener('click', (e)=>{
             if(!fieldResultInvoice.contains(e.target) && !fieldResultManifest.contains(e.target)){
                fieldResultInvoice.style.display = 'none';
                fieldResultManifest.style.display = 'none'
             }
            })

            nameFieldInvoice.addEventListener('input', debounce(()=>{
            autocompleteMI(nameFieldInvoice, idFieldInvoice, fieldResultInvoice, '/search-invoice?q=', 'id_invoice')
            }, 300))

            nameFieldManifest.addEventListener('input', debounce(()=>{
                 autocompleteMI(nameFieldManifest, idFieldManifest, fieldResultManifest, '/search-manifest?q=', 'id_manifest')
            }, 300))

            formState=true;
         }else{
            formGlasses.style.display = 'none'
            formState=false;
         }

 /*
        })
 */
        // searchGlass dropDown

        async function autoCompleteGlass(input, field) {
            field.innerHTML = ''
            field.style.display = 'none';
            if(input.classList.contains('boxShadowOn')){
            input.classList.remove('boxShadowOn');
            }
            const valueSearch = input.value;

            if(valueSearch.length < 2) return;

            const res = await fetch(`/search-glass-results?glass=${valueSearch}`);
            const data = await res.json();

            if(data.length === 0) return field.style.display = 'none'
            
            data.forEach(item =>{
                const result = document.createElement('div');
                result.classList.add('item-glass-result');
                result.textContent = item.code;

                result.addEventListener('click', ()=>{
                    window.location.href = `/search-mid?glass_model=${item.code}`;
                })

                field.appendChild(result);
            })

            field.style.display = 'block'
            input.classList.add('boxShadowOn')
        }

        //-------------------------------------------------//
        //                   Show Table
        //-------------------------------------------------//

        async function showTableInfo() {

            tableGlass.innerHTML = ' '
            const res = await fetch(`/get-glasses?p=${currentPage}`);
            const data = await res.json();
            const {totalGlasses : count} = data
            globalCount = count;


          if(currentPage <= 1){
          btnBack.style.color = '#adadad'
          btnBack.style.pointerEvents = 'none'
        }else{
          btnBack.style.color = '#383838'
          btnBack.style.pointerEvents = 'auto'
        }

          if(currentPage === globalCount){
            btnNext.style.color = '#adadad'
            btnNext.style.pointerEvents = 'none'
          }else{
          btnNext.style.color = '#383838'
          btnNext.style.pointerEvents = 'auto'
          }


            data.data.forEach(item =>{
                //Contenedor de la fila
                const newTr = document.createElement('tr');
                newTr.innerHTML = `
                <td>${item.brand}</td>
                <td>${item.code}</td>
                <td>${item.ship_order}</td>
                <td><a href="${item.invoice_id.url}" target="_blank"><i class="fa-solid fa-eye"></i></a></td>
                <td><a href="${item.manifest_id.url}" target="_blank"><i class="fa-solid fa-eye"></i></a></td>
                `
                tableGlass.appendChild(newTr)

            });
        }

        btnInfoShow[1].addEventListener('click', ()=>{
         tableContainer.classList.toggle('active')

         if(!tableState){
         tableGlasses.style.display = 'block';
         tableState = true;
         } else{
         tableGlasses.style.display = 'none';
         tableState = false;
         }

        })

        if(inputSearchGlass){
            inputSearchGlass.addEventListener('input', debounce(()=>{
            autoCompleteGlass(inputSearchGlass, searchGlassResults)
            }, 300));
        }
        // end

        showTableInfo()

       function clickBack(){
        if(currentPage <= 1 ){
            showTableInfo();
        }else{
            currentPage--;
            showTableInfo()
        }
        
       }

       const clickNext = () =>{
        if(currentPage === globalCount){
            return
        } else{
            currentPage++
            showTableInfo();
        }
       }

</script>
</body>
</html>
