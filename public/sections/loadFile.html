<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Files</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../styles/index.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="#">Cargar Monturas</a></li>
            <li><a href="#"><span class="bold">Facturas</span></a></li>
            <li><a href="#">Manifiestos</a></li>
        </ul>
        <form action="" class="form-search-glass">
        <label for="search-glass"><input type="text" name="search-glass" id="search-glass" placeholder="Numero de modelo Ej: M27142..."></label>
    </form>
</nav>
    <main>
        <h1>Administracion de facturas</h1>
    <p>Cargar una Factura</p>
        
    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="pdf" id="btn-file"  style="margin-bottom: 25px" accept=".pdf">

    <div class="btn-container">
        <button type="submit" class="btn-upload">Cargar<i class="fa-solid fa-upload"></i></button>
    </div>
    </form>
    </main>

    <div class="pdf-container">
     <table>
        <thead>
            <th>Name</th>
            <th>Size</th>
            <th>Date</th>
            <th>Ver</th>
        </thead>
        <tbody class="pdf-container-tbody"></tbody>
     </table>
    </div>
<script>
    const form_container = document.querySelector('form');
    const pdf_container = document.querySelector('.pdf-container-tbody')
    document.addEventListener('DOMContentLoaded', ()=>{
      setTimeout(()=>{
       document.body.style.opacity = '1'
       document.body.style.pointerEvents = 'auto'
      }, 1000)
    })
</script>
</body>
</html>
