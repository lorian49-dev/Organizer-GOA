<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer-GOA</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>
    <header>
        <img class="logo-andes" src="/logo-types/GOA-LOGO.png" alt="">
        <div class="organizer_logo">
            <span>.organizer</span>
        </div>
    </header>
    <form action="" class="form-search-glass">
        <label for="search-glass"><input type="text" name="search-glass" id="search-glass" placeholder="Numero de modelo Ej: M27142..."></label>
    </form>
    <div class="main">
        <a href="#"><section>Monturas<i class="fa-solid fa-glasses"></i></section></a>
        <a href="sections/loadFile.html"><section>Facturas<i class="fa-solid fa-file-invoice-dollar"></i></section></a>
        <a href="#"><section>Manifiestos<i class="fa-solid fa-file-invoice"></i></section></a>
    </div>
    <script>
        const img_logo = document.querySelector('.logo-andes');
        const org_logo = document.querySelector('.organizer_logo')
        const sectionButtons = document.querySelectorAll('section')
        const waiting = (ms) => new Promise(resolve => setTimeout(resolve, ms))
        addEventListener('DOMContentLoaded', async()=>{
            setTimeout(()=>{
       document.body.style.opacity = '1'
       document.body.style.pointerEvents = 'auto'
      }, 1000)
             await waiting(1000)
             img_logo.style.transform = 'translateY(0)'
             await waiting(500)
             img_logo.style.opacity = '1'
            await waiting(1000)
             img_logo.style.transform = 'translateX(-10%)'
             org_logo.style.opacity = '1'
             org_logo.style.transform = 'translateX(0%)'     
            for(const secion of sectionButtons){
            await waiting(300)
            secion.style.opacity = '1'
            secion.style.setProperty('--escala', '1')
            }
        });
    </script>
</body>
</html>
