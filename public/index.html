<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer-GOA</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>
    <header>
        <img class="logo-andes" src="/logo-types/GOA-LOGO.png" alt="">
        <div class="organizer_logo">
            <span>.organizer</span>
        </div>
    </header>
    <!--Formulario de busqueda de monturas-->
    <form action="/search-mid" class="form-search-glass" method="get">
        <label class="label-for-search-input"><input type="text" name="glass_model" id="search-glass" placeholder="Numero de modelo Ej: M27142..." autocomplete="off">
        <div class="field-results-glasses">
            
        </div>
        </label>
    </form>
    <div class="main">
        <a href="/sections/glasses.html"><section>Monturas<i class="fa-solid fa-glasses"></i></section></a>
        <a href="sections/loadFile.html"><section>Facturas<i class="fa-solid fa-file-invoice-dollar"></i></section></a>
        <a href="sections/loadManiefst.html"><section>Manifiestos<i class="fa-solid fa-file-invoice"></i></section></a>
    </div>
    <div class="modal-container">
        <div class="modal-windows">
            <div class="modal-windows-content">
                <h2 class="tittleModal">Bienvenido</h2>
                <h3 class="subtittlemodal">Instrucciones de uso</h3>
                <div class="modal-img"><img src="/logo-types/GOA-LOGO.png" alt="imagen de Grupo optico andes"></div>
            </div>
            <div class="instrucciones">
              <button class="btn-close-windows">Cerrar</button>
              <button class="btn-dont-show-again" onclick="acceptCookie()">No volver a mostrar</button>
              <button class="btn-back" style="display: none;">Atras</button>
              <button class="btn-next">Siguiente</button>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
