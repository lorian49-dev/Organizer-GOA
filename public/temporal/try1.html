<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
        
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header{
            width: 100%;
            height: 50px;
            background: linear-gradient(90deg,rgba(2, 0, 36, 1) 0%, rgba(9, 9, 121, 1) 35%, rgba(0, 212, 255, 1) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Roboto", sans-serif;
            font-optical-sizing: auto;
            font-weight: 100;
            font-style: normal;
            color: aliceblue;
        }

        main{
            width: 60%;
            height: 500px;
            border-radius: 25px;
            background: #39E8E8;
            background: linear-gradient(90deg, #39E8E8, #4D35E3);
            margin: 100px auto;
            display: flex;
            padding: 25px;
            gap: 25px;
        }

        section{
            width: 70%;
            height: 100%;
            border-radius: 25px;
            background-color: rgb(255, 255, 255);
            padding: 25px;
            
        }

        section p{
            display: flex;  
            width: 100%;
            flex-wrap: wrap;
            gap: 15px;
        }


        section span{
            display: inline-block;
            min-height: 25px;
            max-height: 30px;
            border-radius: 10px;
            flex: 1 0 calc(100% - 215px);
        }

        .placeholder-3, .placeholder-4{
            flex: 1 0 80px !important;
        }

        .placeholder-6{
            flex:  0 1 200px !important;
        }

        
        .phantom-line{
            background: linear-gradient(90deg, rgb(184, 184, 184), rgb(218, 218, 218), rgb(184, 184, 184)) ;
            background-size: 200% 100% !important;
            animation: skeleton-loading 2s infinite ease-in-out;
        }

        .phantom-line.placeholder-15{
            width: 150px;
            height: 150px;
            border-radius: 25px;
            margin-top: 25px;
 
        }

       /* @keyframes squart{
            0%{
             transform: translateX(0);
            }
            100%{
              transform: translateX(100px);
            }
        }*/

        aside{
            width: 30%;
            height: 100%;
            border-radius: 25px;
            background-color: rgb(255, 255, 255);
            padding: 25px;
        }
        
        aside p{
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        aside span{
            display: inline-block;
            min-height: 25px;
            max-height: 30px;
            border-radius: 10px;
            flex: 1 1 calc(100% - 65px);
        }

        .placeholder-12{
            flex: 0 0 50px !important;
        }

        @keyframes skeleton-loading {
            0%{
             background-position: 200% 0;
            }
            100%{
            background-position: -200% 0;
            }
        }

    </style>
</head>
<body>
    <header>MyWebPage</header>
    <main>
        <section><!--Aqui ira el efecto de procesado-->
         <p>
            <span class="phantom-line placeholder-1"></span>
            <span class="phantom-line placeholder-2"></span>
            <span class="phantom-line placeholder-3"></span>
            <span class="phantom-line placeholder-4"></span>
            <span class="phantom-line placeholder-5"></span>
            <span class="phantom-line placeholder-6"></span>
            <span class="phantom-line placeholder-7"></span>
         </p>
         <div class="phantom-line placeholder-15"></div>
        </section>
        <aside><!--Aqui ira el efecto de procesado-->
        <p>
            <span class="phantom-line placeholder-8"></span>
            <span class="phantom-line placeholder-9"></span>
            <span class="phantom-line placeholder-10"></span>
            <span class="phantom-line placeholder-11"></span>
            <span class="phantom-line placeholder-12"></span>
            <span class="phantom-line placeholder-13"></span>
            <span class="phantom-line placeholder-14"></span>
         </p>
        </aside>
    </main>
    <script>
     
    </script>
</body>
</html>
